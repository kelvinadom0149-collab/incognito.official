services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: local-only-change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://marketplace:local-only-change-me@db:5432/marketplace
      AUTH_SECRET: local-demo-secret-replace-with-32-random-bytes-or-more
      ADMIN_TOKEN: local-demo-admin-token-do-not-use-in-production
      OTP_PEPPER: local-demo-otp-pepper-replace-with-32-random-bytes
      CORS_ORIGINS: http://localhost:8000
      ENABLE_DOCS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
